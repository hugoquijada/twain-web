agent:
  installation_id: "replace-with-a-uuid"
  host: "127.0.0.1"
  port: 8765
  data_directory: "./data"
  temporary_directory: "./data/tmp"
  retention_hours: 24
  allowed_origins:
    - "http://localhost:8000"
    - "http://localhost:3000"
    - "https://cs-oficialia.web.app"
    - "http://127.0.0.1:8765"
  api_token_environment: "DEVICEBRIDGE_API_TOKEN"
  authentication_required: true
  debug_errors: false # Solo para pruebas locales; nunca habilitar en producción.

# Los perfiles de escáner se crean desde el portal local abierto por el icono
# de DeviceBridge. Una sección scanners existente se importa una sola vez a SQLite.

# El binario debe ser el cliente VirtualHere ya instalado, no uno recibido del navegador.
# Sustituya las direcciones por las mostradas por el cliente, por ejemplo SERVIDOR.114.
virtualhere:
  executable_path: "C:\\Program Files\\VirtualHere\\vhui64.exe"
  timeout_seconds: 8
  devices:
    - id: "epson-ticket"
      display_name: "Epson TM-T88V"
      address: "DATONGSMART.114"
