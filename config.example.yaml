agent:
  installation_id: "replace-with-a-uuid"
  host: "127.0.0.1"
  port: 8765
  data_directory: "./data"
  temporary_directory: "./data/tmp"
  retention_hours: 24
  allowed_origins:
    - "https://sistema.ejemplo.gob.mx"
  api_token_environment: "DEVICEBRIDGE_API_TOKEN"

scanners:
  - id: "hp-color-3303"
    display_name: "HP Color LaserJet Pro MFP 3303fdw"
    driver: "simulated" # Cambiar a twain después de validación física en Windows.
    windows_device: "HP Color LaserJet Pro MFP 3303fdw"
    default_source: "adf"
  - id: "hp-mono-4103"
    display_name: "HP LaserJet Pro MFP 4103fdw"
    driver: "simulated" # Cambiar a wia o twain después de validación física.
    windows_device: "HP LaserJet Pro MFP 4103fdw"
    default_source: "adf"
